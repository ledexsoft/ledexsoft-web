<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CumaShop — Producto</title>
  <meta name="description" content="Producto de CumaShop, el mercado de Cumanayagua, en tu celular." />
  <!-- Open Graph: preview de tarjeta en WhatsApp/Telegram -->
  <meta property="og:type" content="product" />
  <meta property="og:site_name" content="CumaShop" />
  <meta property="og:title" content="CumaShop — Producto" />
  <meta property="og:description" content="Míralo en CumaShop, el mercado de Cumanayagua, en tu celular." />
  <meta property="og:image" content="https://ledexsoft.github.io/OneBlinkWeb/assets/hero_cumashop.png" />
  <meta property="og:url" content="https://ledexsoft.github.io/ledexsoft-web/p.html" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230F1B16'/%3E%3Ctext x='50' y='69' font-size='58' font-family='Georgia,serif' fill='%23FF7A3D' text-anchor='middle'%3EC%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/cumashop.css" />
</head>
<body>

<div class="grain" aria-hidden="true"></div>

<header class="site-nav" id="siteNav">
  <a href="cumashop.html" class="logo">
    <span class="mark">C</span>CumaShop
    <span class="logo-by">Un producto de LedexSoft</span>
  </a>
</header>

<main style="min-height: calc(100vh - 76px); display: flex; align-items: center; justify-content: center; padding: 24px;">

  <div style="max-width: 560px; width: 100%;">

    <div id="loading" style="text-align: center; padding: 40px 0;">
      <span class="eyebrow">Producto</span>
      <h1 style="font-family: 'Fraunces', serif; margin-top: 12px;">Cargando producto…</h1>
    </div>

    <div id="notfound" style="display: none; text-align: center; padding: 40px 0;">
      <span class="eyebrow">Producto</span>
      <h1 style="font-family: 'Fraunces', serif; margin-top: 12px;">Producto no encontrado</h1>
      <p style="margin-top: 10px; opacity: .7;">Este enlace no corresponde a un producto activo de CumaShop.</p>
    </div>

    <div id="product" style="display: none; background: rgba(255,255,255,.04); border: 1px solid rgba(255,255,255,.09); border-radius: 24px; padding: 24px;">
      <img id="p-img" alt="" style="width: 100%; border-radius: 16px; aspect-ratio: 1/1; object-fit: cover; background: rgba(255,255,255,.08);" />
      <span class="eyebrow" id="p-store" style="display: inline-block; margin-top: 18px;"></span>
      <h1 id="p-name" style="font-family: 'Fraunces', serif; font-size: 30px; line-height: 1.15; margin-top: 8px;"></h1>
      <p id="p-price" style="font-size: 26px; font-weight: 800; margin-top: 10px;"></p>
      <p id="p-desc" style="white-space: pre-line; opacity: .8; margin-top: 14px; font-size: 15px;"></p>
      <a id="p-open" class="btn-dark" href="#" style="display: block; text-align: center; margin-top: 24px; padding: 16px; border-radius: 14px; color: #fff; text-decoration: none; font-weight: 800; font-size: 16px;">
        Abrir en CumaShop
      </a>
      <p style="font-size: 12px; opacity: .55; margin-top: 12px; text-align: center;">
        ¿No tienes la app? Descárgala desde Google Play.
      </p>
    </div>

  </div>
</main>

<footer style="text-align: center; padding: 24px; opacity: .55; font-size: 12.5px;">
  <a href="cumashop.html" style="color: inherit;">CumaShop</a> · <a href="index.html" style="color: inherit;">LedexSoft</a> · <a href="terminos-clientes.html" style="color: inherit;">Términos</a> · <a href="privacidad.html" style="color: inherit;">Privacidad</a>
</footer>

<script>
(function () {
  var URL_BASE = 'https://tmvqkpkbxagxxgmgqcpl.supabase.co';
  // anon key pública: el catálogo visible es público por diseño (RLS).
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRtdnFrcGtieGFneHhnbWdxY3BsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MjE0ODYwNTcsImV4cCI6MjAzNzA2MjA1N30.Zx5G8Vnmy4ZW2dCKi8ScmcNa40KSqmWL4sEzZoMqwLM';
  var PLAY_URL = 'https://play.google.com/store/apps/details?id=com.ledexsoft.oneblink';

  function $(id) { return document.getElementById(id); }

  function esc(s) {
    var d = document.createElement('div');
    d.textContent = s == null ? '' : String(s);
    return d.innerHTML;
  }

  var params = new URLSearchParams(window.location.search);
  var id = params.get('id');

  if (!id || !/^\d{1,10}$/.test(id)) {
    $('loading').style.display = 'none';
    $('notfound').style.display = 'block';
    return;
  }

  fetch(URL_BASE + '/rest/v1/Ofertas?select=Titulo_Es,Descripcion_Es,Precio_base_UI,Moneda_base,Imagen_Portada,Seccion&id=eq.' + id + '&Activo=eq.true&limit=1', {
    headers: { apikey: ANON, Authorization: 'Bearer ' + ANON }
  })
    .then(function (r) { return r.json(); })
    .then(function (rows) {
      $('loading').style.display = 'none';
      var p = rows && rows[0];
      if (!p) { $('notfound').style.display = 'block'; return; }

      var img = p.Imagen_Portada;
      if (img) { $('p-img').src = img; }
      $('p-name').textContent = p.Titulo_Es || 'Producto';
      $('p-store').textContent = p.Seccion || '';
      var moneda = p.Moneda_base || 'CUP';
      var precio = Number(p.Precio_base_UI || 0);
      $('p-price').textContent = moneda + ' ' + precio.toLocaleString('es', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      $('p-desc').textContent = p.Descripcion_Es || '';

      // Intentar abrir la app vía deep link nativo (cumashop://).
      // iOS: Safari muestra su propio diálogo de confirmación — NO
      // redirigir a Play Store (el timeout competiría con el diálogo y
      // mandaba a Play en vez de abrir la app). Android: si no hay app,
      // el navegador aborta el intent → fallback a Play.
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
      var btn = $('p-open');
      btn.href = PLAY_URL;
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        window.location.href = 'cumashop://producto/' + id;
        if (!isIOS) {
          setTimeout(function () { window.location.href = PLAY_URL; }, 1200);
        }
      });
      $('product').style.display = 'block';
    })
    .catch(function () {
      $('loading').style.display = 'none';
      $('notfound').style.display = 'block';
    });
})();
</script>
</body>
</html>
